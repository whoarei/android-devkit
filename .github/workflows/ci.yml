name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES: |
    Android DevKit v0.9.2 for Windows x64 — changes since v0.9.1.

    Windows 任务栏与固定入口主题图标
    - 主窗口图标随预设和自定义主题色更新，将主题图标扩展到运行中的任务栏按钮及 Alt+Tab；与标题栏 Logo、托盘共用原图和配色规则，保留状态语义色。
    - 为固定入口保存 16 / 24 / 32 / 48 / 64 / 128 像素的主题 ICO，配置 Windows Shell 的程序身份、重启命令、名称和图标资源。
    - 更新当前用户任务栏与开始菜单中指向当前可执行文件的自有快捷方式，保留目标、启动参数、工作目录及其他属性；其他程序、其他副本和不同程序身份的快捷方式不会被改写。
    - 启动恢复、明暗切换和跟随系统均统一刷新；Shell 文件操作在后台合并连续输入，以最新已保存配色为准。图标文件按内容复用，旧固定入口引用的图标保留。

    验证与兼容性
    - 增加 Windows 原生窗口 Shell 属性、多尺寸 ICO 及真实快捷方式更新检查，覆盖 Unicode / 空格路径、参数保留、旧快捷方式迁移及其他副本隔离；沿用完整主题与原图保真回归。
    - 保留现有 SDK、Java、主题偏好与业务数据。运行要求仍为 Windows 11 x64 和 WebView2。
    - 提供当前用户安装器和便携 ZIP；安装版支持签名更新，便携版手动更新。Windows Authenticode 代码签名未配置，完整 Windows 11 Explorer / 固定分组 / DPI 与干净系统安装矩阵未全量实测；受保护或正在被编辑的快捷方式保留原状。

jobs:
  windows:
    name: Windows x64 checks and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        run: pnpm check:version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: TypeScript, frontend build and Clippy
        run: pnpm check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC contracts
        run: |
          pnpm bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/bindings.ts
      - name: Install fixture browser
        run: pnpm exec playwright install chromium
      - name: Production frontend regression tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:ui-fixtures
      - name: Test updater release metadata
        run: node scripts/check-updater-release.cjs
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to produce verified update artifacts.'
          }
      - name: Build Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package portable archive and checksums
        run: ./scripts/package-release.ps1 -WithUpdater
      - name: Verify updater manifest and release checksums
        run: node .agents/skills/android-devkit-release/scripts/verify-release-assets.cjs artifacts/release (Get-Content package.json -Raw | ConvertFrom-Json).version --require-updater
      - name: Verify installer contents
        run: node scripts/check-installer.cjs 'C:/Program Files/7-Zip/7z.exe'
      - name: Verify updater waits for the old process to exit
        run: pnpm test:installer-update
      - name: Verify updater signature with the embedded public key
        env:
          ANDROID_DEVKIT_UPDATE_VERIFY_DIR: ${{ github.workspace }}/artifacts/release
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_release_verifies_with_embedded_public_key -- --ignored
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-evidence-${{ github.sha }}
          path: .qa/app/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-${{ github.sha }}
          path: release
      - name: Verify downloaded assets
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Android DevKit $RELEASE_TAG" --notes-file release-notes.md --latest
