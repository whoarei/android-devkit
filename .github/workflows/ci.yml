name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES: |
    Android DevKit v0.5.0 for Windows x64 — changes since v0.4.0.

    新增与改进
    - 分包 APK 安装：多选 base / split APK 或选择目录，校验包名、版本、签名证书、设备 API / ABI 与依赖关系；使用不可变暂存副本，一次安装整组 APK，默认保留应用数据。
    - 录屏：支持 1–180 秒无声 MP4、原始或缩小分辨率、提前停止、预览、另存及缓存清理；中断后可取回原录屏，完整缓存的 MP4 会在重启后恢复，也可明确确认后放弃设备原件。
    - 文件传输：浏览共享存储 Download、Pictures、Movies、DCIM，多选文件 / 目录或拖入上传，查看进度与取消；同名目标明确选择保留、重命名或替换，先暂存、校验再发布，替换中断保留备份并提供原件恢复入口。

    修复与验证
    - 循环审核并修复 18 组问题：提交重试保持同一请求 ID，防止重复执行；错误显示在发起面板，新选择失败时旧清单作废，提交后持续显示任务进度，弹窗与视频支持键盘焦点约束。
    - 替换完成后再次核对最终内容，异常保留原件备份；恢复、清理与取回对同一源任务互斥，旧历史中的待处理任务仍可访问，普通清理不能删除受保护原件。
    - 修复录屏落盘与登记之间强退后的恢复、已取回视频但设备清理失败的结果反馈，以及未提交暂存的释放与孤立缓存回收。
    - 补齐工具版本排序、base 版本名称、split 循环依赖、目录权限、大目录限额和设备响应截断检查。
    - 本地通过 131 项默认 Rust 测试、10 组界面回归、独立桌面真实 IPC / MP4 回放、隔离实际 SDK 分包升级与文件往返、180 秒录屏、替换中断恢复及外部修改保护；一期 35 场景 / 14 次子进程强杀回归继续通过。

    安装与兼容性
    - 提供当前用户安装包和便携 ZIP；要求 Windows 11 x64 与 WebView2 Runtime。Android SDK 组件另行下载并遵守各自许可。
    - 既有 SDK / Java 配置继续沿用；暂无已知不兼容变更。v0.1.0 用户需手动安装一次以获得应用内更新；便携版继续手动替换。
    - 更新包使用独立签名校验；Windows Authenticode 代码签名尚未配置。
    - 暂不直接导入 AAB / APKS / APKM / XAPK 容器；录屏不含音频，文件传输不访问应用私有目录，不提供断点续传或目录同步。
    - 手机 USB / 无线、OEM 权限与安装限制、锁屏 / 旋转 / 受保护画面、手机录屏外部回放及 Windows 原生文件对话框仍需人工验收；一期暂缓矩阵继续保留 TODO，未计为已通过。

jobs:
  windows:
    name: Windows x64 checks and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        run: pnpm check:version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: TypeScript, frontend build and Clippy
        run: pnpm check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC contracts
        run: |
          pnpm bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/bindings.ts
      - name: Install fixture browser
        run: pnpm exec playwright install chromium
      - name: Production frontend regression tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:ui-fixtures
      - name: Test updater release metadata
        run: node scripts/check-updater-release.cjs
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to produce verified update artifacts.'
          }
      - name: Build Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package portable archive and checksums
        run: ./scripts/package-release.ps1 -WithUpdater
      - name: Verify updater manifest and release checksums
        run: node .agents/skills/android-devkit-release/scripts/verify-release-assets.cjs artifacts/release (Get-Content package.json -Raw | ConvertFrom-Json).version --require-updater
      - name: Verify installer contents
        run: node scripts/check-installer.cjs 'C:/Program Files/7-Zip/7z.exe'
      - name: Verify updater waits for the old process to exit
        run: pnpm test:installer-update
      - name: Verify updater signature with the embedded public key
        env:
          ANDROID_DEVKIT_UPDATE_VERIFY_DIR: ${{ github.workspace }}/artifacts/release
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_release_verifies_with_embedded_public_key -- --ignored
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-evidence-${{ github.sha }}
          path: .qa/app/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-${{ github.sha }}
          path: release
      - name: Verify downloaded assets
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Android DevKit $RELEASE_TAG" --notes-file release-notes.md --latest
