name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES: |
    Android DevKit v0.9.0 for Windows x64 — changes since v0.8.0.

    主题配色与统一外观
    - 七个页面、弹窗与终端统一科技风格，提升背景、面板、文字与选中状态的层次，移除左侧强调线。
    - 新增标题栏“外观”与设置中的完整外观入口，支持默认、蓝、绿、黄、粉、橙、紫、黑和自定义颜色，提供取色器及 HEX 输入。
    - 浅色、深色和跟随系统独立于配色切换；主题自动保存并恢复，保留已有用户明暗偏好，新用户默认跟随系统。
    - 按配色调整强调色与文字对比度，覆盖终端、启动背景、中英文与窄窗口；切换外观保留草稿和终端会话。

    无线扫码配对与自动连接
    - 新增 Android 无线调试二维码配对，以及自动发现设备后输入 6 位配对码的连接方式；配对后自动发现并验证连接，成功后关闭面板。
    - 本机 mDNS 发现支持多网卡、地址变化和重名服务，无需 Bonjour；本机发现不可用时尝试 ADB 发现，保留手动配对、已配对连接和网络 ADB 入口。
    - 完善配对超时、取消、失效端口与服务名断开连接，配对码和二维码密钥不写入任务记录；继续复用共享 ADB，不自动重启其他工具的 ADB 服务。

    验证与兼容性
    - 新增主题持久化、旧偏好迁移、配色对比度、系统主题变化与无线连接回归；发布流程执行完整 Rust、界面、安装器与更新签名检查。
    - 保留现有 SDK、Java 与业务数据；要求 Windows 11 x64 和 WebView2。无线配对要求 Android 11+，手机与电脑位于可互通且允许 mDNS 的局域网，网络隔离、防火墙或 VPN 可能影响发现。
    - 提供当前用户安装器和便携 ZIP；安装版支持签名更新，便携版手动更新。Windows Authenticode 代码签名未配置；已完成实体手机无线连接验证，OEM、复杂网络、多用户与干净系统矩阵仍未全量实测。

jobs:
  windows:
    name: Windows x64 checks and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        run: pnpm check:version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: TypeScript, frontend build and Clippy
        run: pnpm check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC contracts
        run: |
          pnpm bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/bindings.ts
      - name: Install fixture browser
        run: pnpm exec playwright install chromium
      - name: Production frontend regression tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:ui-fixtures
      - name: Test updater release metadata
        run: node scripts/check-updater-release.cjs
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to produce verified update artifacts.'
          }
      - name: Build Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package portable archive and checksums
        run: ./scripts/package-release.ps1 -WithUpdater
      - name: Verify updater manifest and release checksums
        run: node .agents/skills/android-devkit-release/scripts/verify-release-assets.cjs artifacts/release (Get-Content package.json -Raw | ConvertFrom-Json).version --require-updater
      - name: Verify installer contents
        run: node scripts/check-installer.cjs 'C:/Program Files/7-Zip/7z.exe'
      - name: Verify updater waits for the old process to exit
        run: pnpm test:installer-update
      - name: Verify updater signature with the embedded public key
        env:
          ANDROID_DEVKIT_UPDATE_VERIFY_DIR: ${{ github.workspace }}/artifacts/release
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_release_verifies_with_embedded_public_key -- --ignored
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-evidence-${{ github.sha }}
          path: .qa/app/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-${{ github.sha }}
          path: release
      - name: Verify downloaded assets
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Android DevKit $RELEASE_TAG" --notes-file release-notes.md --latest
