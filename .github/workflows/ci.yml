name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES: |
    Android DevKit v0.4.0 for Windows x64 — changes since v0.3.0.

    新增与改进
    - 首次使用可发现并显式复用已有 SDK，显示来源、可写状态、工具路径和可用空间；新配置默认使用当前用户的 %LOCALAPPDATA%\Android\Sdk，已保存路径继续沿用。
    - 新增 Java 环境检测，可选择已有 Java / Android Studio JBR，或按许可确认准备、修复与复用私有运行时。
    - 模拟器系统镜像按 Android API 版本分组；增加 AVD 实际占用统计和按磁盘卷合并的安装 / 暂存空间预算。
    - 增加默认设备、列表键盘操作、设备标识与 AVD 路径复制，以及先预览再复制的脱敏环境摘要。
    - 支持启动超时后继续等待、设备就绪后安装 APK；取消等待不停止设备，断线或 ADB 服务变化后不会自动改投其他目标。
    - 任务中心支持删除历史任务记录与清理原始采集文件，优化紧凑操作布局，并简化冗余环境提示和底部状态栏。

    修复与验证
    - 修复多个模拟器同时在线时 emulator console 目标歧义；命令在核验原连接后绑定序列号。
    - 修复应用内升级时安装器先于旧进程退出导致安装失败的问题。
    - 增加 35 场景故障专项，包含 14 次提交点进程强杀，覆盖下载、SDK 引导、AVD、APK 响应边界、导出、采集、SQLite 回滚和文件锁；补充 UI 与隔离实际模拟器回归。

    安装与兼容性
    - 提供当前用户安装包和便携 ZIP；要求 Windows 11 x64 与 WebView2 Runtime。Android SDK 组件另行下载并遵守各自许可。
    - 既有 SDK / Java 配置继续沿用；暂无已知不兼容变更。v0.1.0 用户需手动安装一次以获得应用内更新；便携版继续手动替换。
    - 更新包使用独立签名校验；Windows Authenticode 代码签名尚未配置。
    - 实体手机完整矩阵、干净系统安装 / 卸载、真实安装升级、多显示器混合 DPI、小时级日志耐久与端到端压力仍保留 TODO，未计为已通过。

jobs:
  windows:
    name: Windows x64 checks and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        run: pnpm check:version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: TypeScript, frontend build and Clippy
        run: pnpm check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC contracts
        run: |
          pnpm bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/bindings.ts
      - name: Install fixture browser
        run: pnpm exec playwright install chromium
      - name: Production frontend regression tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:ui-fixtures
      - name: Test updater release metadata
        run: node scripts/check-updater-release.cjs
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to produce verified update artifacts.'
          }
      - name: Build Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package portable archive and checksums
        run: ./scripts/package-release.ps1 -WithUpdater
      - name: Verify updater manifest and release checksums
        run: node .agents/skills/android-devkit-release/scripts/verify-release-assets.cjs artifacts/release (Get-Content package.json -Raw | ConvertFrom-Json).version --require-updater
      - name: Verify installer contents
        run: node scripts/check-installer.cjs 'C:/Program Files/7-Zip/7z.exe'
      - name: Verify updater waits for the old process to exit
        run: pnpm test:installer-update
      - name: Verify updater signature with the embedded public key
        env:
          ANDROID_DEVKIT_UPDATE_VERIFY_DIR: ${{ github.workspace }}/artifacts/release
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_release_verifies_with_embedded_public_key -- --ignored
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-evidence-${{ github.sha }}
          path: .qa/app/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-${{ github.sha }}
          path: release
      - name: Verify downloaded assets
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Android DevKit $RELEASE_TAG" --notes-file release-notes.md --latest
