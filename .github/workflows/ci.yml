name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES: |
    Android DevKit v0.8.0 for Windows x64 — changes since v0.7.0.

    设备应用管理
    - 在设备详情中搜索当前 Android 用户的应用，查看版本、UID、API 与完整安装路径；支持启动、停止、清数据、卸载和 APK 导出。
    - 清数据与卸载前确认影响，执行前复查设备连接、Android 用户及应用身份；系统应用仅提供查看、启动和导出。
    - 完整导出已安装的 base / split APK，校验大小及 SHA-256，单 APK 或整组 APKS 可另存和重新导入；完整发布结果支持中断后恢复，不备份应用私有数据。

    安装包容器
    - 新增 APKS / XAPK / APKM 导入；官方 APKS 使用 bundletool 按目标设备 API、ABI、语言及密度选包，普通集合按兼容架构筛选。
    - 导入结果绑定原设备连接，统一检查签名、版本、依赖与兼容性；拒绝路径越界、重复 / 链接条目和超量解压。
    - bundletool 按需从官方发行下载，固定版本、大小与 SHA-256，沿用应用手动代理。AAB、加密容器和含 OBB 扩展数据的安装包暂不支持。

    投屏与控制
    - 使用按需准备的官方 scrcpy 打开独立投屏窗口，支持控制 / 只读、原始或受限分辨率、30 / 60 FPS。
    - 私有 ADB 代理将会话绑定到原 transport-id，断线后结束；关闭窗口或停止任务仅结束自有会话，共享 ADB 保持运行。
    - 投屏时可继续其他设备操作；默认无音频、不自动同步剪贴板，控制模式的键鼠和原生拖入直接作用于当前设备。

    验证与兼容性
    - 完成 163 项 Rust 常规回归、全部 13 套界面回归，以及双专用 API 29 模拟器的真实安装、APK 导出再导入、目标保护、投屏渲染 / 并发 / 停止和应用操作测试。
    - 保留现有 SDK、Java 与业务数据；要求 Windows 11 x64、WebView2，APK 集合校验沿用 Java 与 SDK Build-Tools。
    - 提供当前用户安装器和便携 ZIP；安装版支持签名更新，便携版手动更新。Windows Authenticode 代码签名未配置；实体手机、OEM 限制、无线输入与完整多用户 / 干净系统矩阵未全量实测。

jobs:
  windows:
    name: Windows x64 checks and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify release version
        run: pnpm check:version
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: TypeScript, frontend build and Clippy
        run: pnpm check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated IPC contracts
        run: |
          pnpm bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/bindings.ts
      - name: Install fixture browser
        run: pnpm exec playwright install chromium
      - name: Production frontend regression tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:ui-fixtures
      - name: Test updater release metadata
        run: node scripts/check-updater-release.cjs
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to produce verified update artifacts.'
          }
      - name: Build Windows executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package portable archive and checksums
        run: ./scripts/package-release.ps1 -WithUpdater
      - name: Verify updater manifest and release checksums
        run: node .agents/skills/android-devkit-release/scripts/verify-release-assets.cjs artifacts/release (Get-Content package.json -Raw | ConvertFrom-Json).version --require-updater
      - name: Verify installer contents
        run: node scripts/check-installer.cjs 'C:/Program Files/7-Zip/7z.exe'
      - name: Verify updater waits for the old process to exit
        run: pnpm test:installer-update
      - name: Verify updater signature with the embedded public key
        env:
          ANDROID_DEVKIT_UPDATE_VERIFY_DIR: ${{ github.workspace }}/artifacts/release
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib signed_release_verifies_with_embedded_public_key -- --ignored
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-evidence-${{ github.sha }}
          path: .qa/app/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-${{ github.sha }}
          path: release
      - name: Verify downloaded assets
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Android DevKit $RELEASE_TAG" --notes-file release-notes.md --latest
