[package]
name = "android-devkit"
version = "0.4.0"
description = "Local Android environment and device workbench"
edition = "2021"
rust-version = "1.85"

[lib]
name = "android_devkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
# Enable the saved SOCKS proxy setting for the updater's reqwest version too.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
roxmltree = "0.21"
regex = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
base64 = "0.22"
rfd = "0.15"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_UI_HiDpi"] }

[dev-dependencies]
minisign-verify = "0.3"
tempfile = "3"
ts-rs = "11"
